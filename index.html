<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wishly — Birthday Surprise</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#08050d;color:white} .wrap{max-width:1100px;margin:auto;padding:35px 18px}.head{text-align:center}h1{font-size:clamp(38px,6vw,64px);margin:0;background:linear-gradient(90deg,#ffd4ea,#ff73bd,#b58cff);-webkit-background-clip:text;color:transparent}p{color:#c7bdce}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#120c1c;border:1px solid #ffffff18;border-radius:22px;padding:20px}label{font-size:12px;color:#bcb1c8;display:block;margin:10px 0 5px}input,textarea,select{width:100%;background:#0d0815;color:#fff;border:1px solid #ffffff20;border-radius:10px;padding:11px}textarea{min-height:80px}.row,.memories{display:grid;grid-template-columns:1fr 1fr;gap:10px}.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.theme{height:50px;border-radius:10px;border:2px solid transparent;cursor:pointer}.active{border-color:white}.normal{background:linear-gradient(135deg,#34184e,#090615)}.aurora{background:linear-gradient(135deg,#0b506d,#472080,#10172e)}.sunset{background:linear-gradient(135deg,#ff7b72,#8f2c82,#1a102d)}.ocean{background:linear-gradient(135deg,#087f8c,#182b66)}.hearts{background:linear-gradient(135deg,#681344,#17091b)}button{border:0;border-radius:12px;padding:13px;font-weight:800;cursor:pointer}.primary{width:100%;background:linear-gradient(90deg,#ff58ad,#9d6cff);color:white}.preview{min-height:600px;border-radius:18px;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;background:linear-gradient(160deg,#36164e,#090511)}.preview.aurora{background:linear-gradient(160deg,#0c5368,#3c1d68,#090b19)}.preview.sunset{background:linear-gradient(160deg,#ff796d,#78245f,#100718)}.preview.ocean{background:linear-gradient(160deg,#07808a,#1b2c6a,#080d20)}.preview.hearts{background:linear-gradient(160deg,#65133f,#150713)}.gift{font-size:64px}.hidden{display:none}.share{word-break:break-all;background:#ffffff12;padding:10px;margin:10px 0;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row,.memories{grid-template-columns:1fr}.preview{min-height:420px}}
</style></head><body><div class="wrap">
<div class="head"><h1>Make their birthday magical.</h1><p>Create it once. Share one link. They experience the whole surprise.</p></div>
<div class="grid"><section class="card"><h2>🎨 Create Surprise</h2>
<label>Language</label><select id="language"><option>English</option><option>Hindi</option></select>
<div class="row"><div><label>Name</label><input id="name" placeholder="Their name"></div><div><label>Birthday</label><input id="birthday" type="date"></div></div>
<label>Birthday greeting</label><textarea id="message">Happy Birthday, my special person ❤️

I hope your day is as beautiful as your smile. Keep smiling, keep shining and always remember that you are truly special to me.</textarea>
<label>Line before memories</label><input id="memoryLine" value="There is something special I want you to see... 💌">
<label>Personalise background / theme</label><div class="themes"><div class="theme normal active" data-t="normal"></div><div class="theme aurora" data-t="aurora"></div><div class="theme sunset" data-t="sunset"></div><div class="theme ocean" data-t="ocean"></div><div class="theme hearts" data-t="hearts"></div></div>
<label>📸 Memories — up to 4</label><div class="memories">
<div><input type="file" accept="image/*" class="photo"><textarea class="cap" placeholder="Caption 1"></textarea></div>
<div><input type="file" accept="image/*" class="photo"><textarea class="cap" placeholder="Caption 2"></textarea></div>
<div><input type="file" accept="image/*" class="photo"><textarea class="cap" placeholder="Caption 3"></textarea></div>
<div><input type="file" accept="image/*" class="photo"><textarea class="cap" placeholder="Caption 4"></textarea></div></div>
<label>Final greeting</label><textarea id="finalGreeting">Once again, Happy Birthday! 💗 May your life always be filled with happiness, beautiful memories and countless reasons to smile.</textarea>
<label>Final image (optional)</label><input id="finalImage" type="file" accept="image/*">
<br><br><button class="primary" id="create">✨ CREATE & GET SHARE LINK — ₹39</button><p id="status"></p><div id="share" class="hidden"><b>🎉 Surprise ready!</b><div class="share" id="url"></div><button id="copy">Copy link</button></div>
</section><section class="card"><h2>👀 Experience Preview</h2><div id="preview" class="preview"><div><div class="gift">🎁</div><h2 id="pn">Someone special</h2><p id="pm">Your birthday surprise will appear here.</p><p id="pl"></p></div></div></section></div></div>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script><script>
const $=x=>document.getElementById(x);let theme="normal";
document.querySelectorAll(".theme").forEach(x=>x.onclick=()=>{document.querySelectorAll(".theme").forEach(y=>y.classList.remove("active"));x.classList.add("active");theme=x.dataset.t;render()});
function render(){$("pn").textContent=$("name").value||"Someone special";$("pm").textContent=$("message").value;$("pl").textContent=$("memoryLine").value;$("preview").className="preview "+theme}
["name","message","memoryLine"].forEach(x=>$(x).oninput=render);render();
function img(file){return new Promise((ok,no)=>{if(!file)return ok(null);let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let s=Math.min(1,900/im.width,900/im.height),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}
async function post(u,b){let r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");return d}
$("create").onclick=async()=>{try{$("status").textContent="Preparing...";if(!$("name").value||!$("birthday").value)throw Error("Enter name and birthday.");let ps=[...document.querySelectorAll(".photo")],cs=[...document.querySelectorAll(".cap")],mem=[];for(let i=0;i<ps.length;i++)if(ps[i].files[0])mem.push({image:await img(ps[i].files[0]),caption:cs[i].value});let final=await img($("finalImage").files[0]);let payload={name:$("name").value,birthday:$("birthday").value,language:$("language").value,message:$("message").value,memoryLine:$("memoryLine").value,theme,memories:mem,finalGreeting:$("finalGreeting").value,finalImage:final};$("status").textContent="Opening payment...";let o=await post("/api/create-order",{amount:39});new Razorpay({key:o.key_id,amount:o.amount,currency:"INR",name:"Wishly",description:"Birthday Surprise",order_id:o.id,handler:async r=>{try{await post("/api/verify-payment",r);let s=await post("/api/create-surprise",{...payload,paymentId:r.razorpay_payment_id,orderId:r.razorpay_order_id});$("url").textContent=s.url;$("share").classList.remove("hidden");$("status").textContent="Done 🎉"}catch(e){$("status").textContent=e.message}},theme:{color:"#ff58ad"}}).open()}catch(e){$("status").textContent=e.message}};
$("copy").onclick = async () => {
  const text = $("url").textContent;

  try {
    await navigator.clipboard.writeText(text);
    $("copy").textContent = "Copied ✓";

    setTimeout(() => {
      $("copy").textContent = "Copy link";
    }, 2000);

  } catch (e) {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();

    try {
      document.execCommand("copy");
      $("copy").textContent = "Copied ✓";
    } catch (err) {
      $("status").textContent = "Copy failed. Please copy the link manually.";
    }

    document.body.removeChild(textarea);

    setTimeout(() => {
      $("copy").textContent = "Copy link";
    }, 2000);
  }
};
</script></body></html>
