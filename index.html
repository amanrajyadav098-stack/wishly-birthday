<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wishly — Birthday Surprise</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:system-ui;
background:#08050d;
color:white
}
.wrap{
max-width:1100px;
margin:auto;
padding:35px 18px
}
.head{text-align:center}
h1{
font-size:clamp(38px,6vw,64px);
margin:0;
background:linear-gradient(90deg,#ffd4ea,#ff73bd,#b58cff);
-webkit-background-clip:text;
color:transparent
}
p{color:#c7bdce}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px
}
.card{
background:#120c1c;
border:1px solid #ffffff18;
border-radius:22px;
padding:20px
}
label{
font-size:12px;
color:#bcb1c8;
display:block;
margin:10px 0 5px
}
input,textarea,select{
width:100%;
background:#0d0815;
color:#fff;
border:1px solid #ffffff20;
border-radius:10px;
padding:11px
}
textarea{min-height:80px}
.row,.memories{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}
.themes{
display:grid;
grid-template-columns:repeat(5,1fr);
gap:7px
}
.theme{
height:50px;
border-radius:10px;
border:2px solid transparent;
cursor:pointer
}
.active{border-color:white}
.normal{background:linear-gradient(135deg,#34184e,#090615)}
.aurora{background:linear-gradient(135deg,#0b506d,#472080,#10172e)}
.sunset{background:linear-gradient(135deg,#ff7b72,#8f2c82,#1a102d)}
.ocean{background:linear-gradient(135deg,#087f8c,#182b66)}
.hearts{background:linear-gradient(135deg,#681344,#17091b)}
button{
border:0;
border-radius:12px;
padding:13px;
font-weight:800;
cursor:pointer
}
.primary{
width:100%;
background:linear-gradient(90deg,#ff58ad,#9d6cff);
color:white
}
.preview{
min-height:600px;
border-radius:18px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:25px;
background:linear-gradient(160deg,#36164e,#090511)
}
.preview.aurora{background:linear-gradient(160deg,#0c5368,#3c1d68,#090b19)}
.preview.sunset{background:linear-gradient(160deg,#ff796d,#78245f,#100718)}
.preview.ocean{background:linear-gradient(160deg,#07808a,#1b2c6a,#080d20)}
.preview.hearts{background:linear-gradient(160deg,#65133f,#150713)}
.gift{font-size:64px}
.hidden{display:none!important}
.share{
word-break:break-all;
background:#ffffff12;
padding:10px;
margin:10px 0;
border-radius:8px
}

/* SURPRISE */
#surprisePage{
max-width:850px;
margin:40px auto;
padding:20px
}
.surprise-card{
background:#120c1c;
border:1px solid #ffffff18;
border-radius:25px;
padding:35px;
text-align:center
}
.big{
font-size:80px;
margin:10px
}
.surprise-card h1{
font-size:clamp(35px,7vw,60px)
}
.next{
background:linear-gradient(90deg,#ff58ad,#9d6cff);
color:white;
margin-top:20px;
min-width:190px
}
.memory{
margin:25px auto;
max-width:650px
}
.memory img{
width:100%;
max-height:500px;
object-fit:contain;
border-radius:20px
}
.final-image{
width:100%;
max-height:550px;
object-fit:contain;
border-radius:20px
}
.camera{
width:100%;
max-width:600px;
border-radius:20px;
margin:20px auto
}
.candle{
font-size:110px;
margin:15px
}
@media(max-width:800px){
.grid{grid-template-columns:1fr}
.row,.memories{grid-template-columns:1fr}
.preview{min-height:420px}
}
</style>
</head>

<body>

<!-- CREATOR PAGE -->

<div id="creatorPage">

<div class="wrap">

<div class="head">
<h1>Make their birthday magical.</h1>
<p>Create it once. Share one link. They experience the whole surprise.</p>
</div>

<div class="grid">

<section class="card">

<h2>🎨 Create Surprise</h2>

<label>Language</label>

<select id="language">
<option>English</option>
<option>Hindi</option>
<option>Hinglish</option>
<option>Bengali</option>
<option>Punjabi</option>
</select>

<div class="row">

<div>
<label>Name</label>
<input id="name" placeholder="Their name">
</div>

<div>
<label>Birthday</label>
<input id="birthday" type="date">
</div>

</div>

<label>Birthday greeting</label>

<textarea id="message">Happy Birthday, my special person ❤️

I hope your day is as beautiful as your smile. Keep smiling, keep shining and always remember that you are truly special to me.</textarea>

<label>Line before memories</label>

<input id="memoryLine"
value="There is something special I want you to see... 💌">

<label>Personalise background / theme</label>

<div class="themes">
<div class="theme normal active" data-t="normal"></div>
<div class="theme aurora" data-t="aurora"></div>
<div class="theme sunset" data-t="sunset"></div>
<div class="theme ocean" data-t="ocean"></div>
<div class="theme hearts" data-t="hearts"></div>
</div>

<label>📸 Memories — up to 4</label>

<div class="memories">

<div>
<input type="file" accept="image/*" class="photo">
<textarea class="cap" placeholder="Caption 1"></textarea>
</div>

<div>
<input type="file" accept="image/*" class="photo">
<textarea class="cap" placeholder="Caption 2"></textarea>
</div>

<div>
<input type="file" accept="image/*" class="photo">
<textarea class="cap" placeholder="Caption 3"></textarea>
</div>

<div>
<input type="file" accept="image/*" class="photo">
<textarea class="cap" placeholder="Caption 4"></textarea>
</div>

</div>

<label>Final greeting</label>

<textarea id="finalGreeting">Once again, Happy Birthday! 💗 May your life always be filled with happiness, beautiful memories and countless reasons to smile.</textarea>

<label>Final image (optional)</label>

<input id="finalImage" type="file" accept="image/*">

<br><br>

<button class="primary" id="create">
✨ CREATE & GET SHARE LINK — ₹39
</button>

<p id="status"></p>

<div id="share" class="hidden">

<b>🎉 Surprise ready!</b>

<div class="share" id="url"></div>

<button id="copy">Copy link</button>

</div>

</section>

<section class="card">

<h2>👀 Experience Preview</h2>

<div id="preview" class="preview">

<div>
<div class="gift">🎁</div>
<h2 id="pn">Someone special</h2>
<p id="pm">Your birthday surprise will appear here.</p>
<p id="pl"></p>
</div>

</div>

</section>

</div>
</div>
</div>


<!-- RECEIVER PAGE -->

<div id="surprisePage" class="hidden">

<div class="surprise-card">

<select id="receiverLanguage">
<option value="English">English</option>
<option value="Hindi">Hindi</option>
<option value="Hinglish">Hinglish</option>
<option value="Bengali">Bengali</option>
<option value="Punjabi">Punjabi</option>
</select>

<div id="surpriseContent"></div>

</div>

</div>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

const $ = id => document.getElementById(id);

let theme="normal";
let surprise=null;
let memoryIndex=0;
let stream=null;


/* CREATOR PREVIEW */

document.querySelectorAll(".theme").forEach(x=>{

x.onclick=()=>{

document.querySelectorAll(".theme")
.forEach(y=>y.classList.remove("active"));

x.classList.add("active");

theme=x.dataset.t;

render();

};

});


function render(){

$("pn").textContent=
$("name").value || "Someone special";

$("pm").textContent=
$("message").value;

$("pl").textContent=
$("memoryLine").value;

$("preview").className=
"preview "+theme;

}


["name","message","memoryLine"]
.forEach(x=>$(x).oninput=render);

render();


/* IMAGE CONVERSION */

function img(file){

return new Promise((resolve,reject)=>{

if(!file)return resolve(null);

let r=new FileReader();

r.onload=()=>{

let im=new Image();

im.onload=()=>{

let scale=
Math.min(1,900/im.width,900/im.height);

let c=document.createElement("canvas");

c.width=im.width*scale;
c.height=im.height*scale;

c.getContext("2d")
.drawImage(im,0,0,c.width,c.height);

resolve(
c.toDataURL("image/jpeg",.72)
);

};

im.src=r.result;

};

r.onerror=reject;

r.readAsDataURL(file);

});

}


/* API POST */

async function post(url,body){

let r=await fetch(url,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(body)

});

let data=await r.json();

if(!r.ok)
throw Error(data.error || "Request failed");

return data;

}


/* PAYMENT */

$("create").onclick=async()=>{

try{

$("status").textContent="Preparing...";

if(
!$("name").value ||
!$("birthday").value
)
throw Error("Enter name and birthday.");


let photos=
[...document.querySelectorAll(".photo")];

let caps=
[...document.querySelectorAll(".cap")];

let memories=[];

for(
let i=0;
i<photos.length;
i++
){

if(photos[i].files[0]){

memories.push({

image:
await img(photos[i].files[0]),

caption:
caps[i].value

});

}

}


let finalImage=
await img($("finalImage").files[0]);


let payload={

name:$("name").value,

birthday:$("birthday").value,

language:$("language").value,

message:$("message").value,

memoryLine:$("memoryLine").value,

theme:theme,

memories:memories,

finalGreeting:$("finalGreeting").value,

finalImage:finalImage

};


$("status").textContent=
"Opening payment...";


let order=
await post(
"/api/create-order",
{amount:39}
);


new Razorpay({

key:order.key_id,

amount:order.amount,

currency:"INR",

name:"Wishly",

description:"Birthday Surprise",

order_id:order.id,

handler:async payment=>{

try{

await post(
"/api/verify-payment",
payment
);


let result=
await post(
"/api/create-surprise",
{

...payload,

paymentId:
payment.razorpay_payment_id,

orderId:
payment.razorpay_order_id

}
);


$("url").textContent=
result.url;

$("share")
.classList.remove("hidden");

$("status").textContent=
"Done 🎉";


}catch(e){

$("status").textContent=e.message;

}

},

theme:{
color:"#ff58ad"
}

}).open();


}catch(e){

$("status").textContent=e.message;

}

};


/* COPY */

$("copy").onclick=async()=>{

let text=$("url").textContent;

try{

await navigator.clipboard.writeText(text);

$("copy").textContent="Copied ✓";

}catch{

let t=document.createElement("textarea");

t.value=text;

document.body.appendChild(t);

t.select();

document.execCommand("copy");

t.remove();

$("copy").textContent="Copied ✓";

}

setTimeout(()=>{
$("copy").textContent="Copy link";
},2000);

};


/* LANGUAGE */

const lang={

English:{
ready:"Are you ready to blow the candles? 🎂",
start:"Start Your Surprise",
blow:"Blow towards the microphone! 💨",
birthday:"Happy Birthday",
memories:"Some beautiful memories for you ❤️",
final:"Once again, Happy Birthday! 💗",
thanks:"Thank you for being so special. ❤️",
next:"Next ❤️"
},

Hindi:{
ready:"क्या तुम candles बुझाने के लिए ready हो? 🎂",
start:"अपना Surprise शुरू करें",
blow:"Microphone की तरफ जोर से फूंक मारो! 💨",
birthday:"जन्मदिन मुबारक हो",
memories:"तुम्हारी कुछ खूबसूरत यादें ❤️",
final:"एक बार फिर जन्मदिन की बहुत-बहुत शुभकामनाएं! 💗",
thanks:"इतने खास होने के लिए धन्यवाद। ❤️",
next:"आगे ❤️"
},

Hinglish:{
ready:"Are you ready candles bhujane ke liye? 🎂",
start:"Start Your Surprise",
blow:"Microphone ki taraf zor se phoonk maaro! 💨",
birthday:"Happy Birthday",
memories:"Tumhari kuch beautiful memories ❤️",
final:"Once again, Happy Birthday! 💗",
thanks:"Itne special hone ke liye thank you. ❤️",
next:"Next ❤️"
},

Bengali:{
ready:"তুমি কি candle নেভানোর জন্য ready? 🎂",
start:"তোমার Surprise শুরু করো",
blow:"Microphone-এর দিকে জোরে ফুঁ দাও! 💨",
birthday:"শুভ জন্মদিন",
memories:"তোমার কিছু সুন্দর স্মৃতি ❤️",
final:"আবারও শুভ জন্মদিন! 💗",
thanks:"এতটা special হওয়ার জন্য ধন্যবাদ। ❤️",
next:"পরেরটি ❤️"
},

Punjabi:{
ready:"ਕੀ ਤੁਸੀਂ candles ਬੁਝਾਉਣ ਲਈ ready ਹੋ? 🎂",
start:"ਆਪਣਾ Surprise ਸ਼ੁਰੂ ਕਰੋ",
blow:"Microphone ਵੱਲ ਜ਼ੋਰ ਨਾਲ ਫੂਕ ਮਾਰੋ! 💨",
birthday:"ਜਨਮਦਿਨ ਮੁਬਾਰਕ",
memories:"ਤੁਹਾਡੀਆਂ ਕੁਝ ਖੂਬਸੂਰਤ ਯਾਦਾਂ ❤️",
final:"ਇੱਕ ਵਾਰ ਫਿਰ ਜਨਮਦਿਨ ਮੁਬਾਰਕ! 💗",
thanks:"ਇੰਨੇ special ਹੋਣ ਲਈ ਧੰਨਵਾਦ। ❤️",
next:"ਅੱਗੇ ❤️"
}

};


function T(){

return lang[
$("receiverLanguage").value
] || lang.English;

}


/* LOAD SHARED SURPRISE */

async function loadShared(){

const params=
new URLSearchParams(
window.location.search
);

const slug=
params.get("surprise");

if(!slug)
return;


try{

let r=
await fetch(
"/api/get-surprise?slug="
+
encodeURIComponent(slug)
);


let data=
await r.json();

if(!r.ok)
throw Error(
data.error || "Surprise not found"
);


surprise=data;

$("creatorPage")
.classList.add("hidden");

$("surprisePage")
.classList.remove("hidden");

$("receiverLanguage").value=
data.language || "English";

showStep(0);


}catch(e){

$("creatorPage")
.classList.add("hidden");

$("surprisePage")
.classList.remove("hidden");

$("surpriseContent").innerHTML=`

<h1>😔 Oops!</h1>

<p>
This surprise could not be loaded.
</p>

<p>
${escapeHtml(e.message)}
</p>

`;

}

}


/* SURPRISE STEPS */

function showStep(step){

let t=T();

let name=
escapeHtml(surprise.name);

let box=
$("surpriseContent");


/* INTRO */

if(step===0){

box.innerHTML=`

<div class="big">🎁</div>

<h1>
${name}
</h1>

<h2>
${t.birthday}! ❤️
</h2>

<p>
${escapeHtml(surprise.message || "")}
</p>

<button class="next" onclick="showStep(1)">
${t.start}
</button>

`;

return;

}


/* READY */

if(step===1){

box.innerHTML=`

<div class="big">🕯️🎂🕯️</div>

<h1>
Are you ready? ❤️
</h1>

<h2>
${t.ready}
</h2>

<button class="next" onclick="startCamera()">
📸 ${t.start}
</button>

`;

return;

}


/* CAMERA */

if(step===2){

box.innerHTML=`

<h1>🕯️</h1>

<div class="camera">

<video
id="camera"
autoplay
playsinline
muted
></video>

</div>

<div class="candle">
🔥 🕯️ 🕯️ 🕯️ 🔥
</div>

<p>
${t.blow}
</p>

<button
id="blowNext"
class="next hidden"
onclick="showStep(3)"
>
${t.next}
</button>

`;

return;

}


/* BIRTHDAY */

if(step===3){

stopCamera();

box.innerHTML=`

<div class="big">🎉🎂🎉</div>

<h1>
${t.birthday}
</h1>

<h2>
${name}! ❤️
</h2>

<p>
${escapeHtml(surprise.message || "")}
</p>

<button class="next" onclick="showStep(4)">
${t.next}
</button>

`;

return;

}


/* MEMORIES */

if(step===4){

let memories=
Array.isArray(surprise.memories)
?surprise.memories
:[];


memoryIndex=0;

if(!memories.length){

showStep(5);

return;

}

showMemory();

return;

}


/* FINAL */

if(step===5){

stopCamera();

box.innerHTML=`

${
surprise.finalImage
?
`<img
class="final-image"
src="${surprise.finalImage}"
>`
:
`<div class="big">💗</div>`
}

<h1>
${t.final}
</h1>

<p>
${escapeHtml(
surprise.finalGreeting || ""
)}
</p>

<h2>
${t.thanks}
</h2>

`;

}

}


/* MEMORY */

function showMemory(){

let t=T();

let memories=
surprise.memories;

let memory=
memories[memoryIndex];


$("surpriseContent").innerHTML=`

<h1>
${t.memories}
</h1>

<div class="memory">

<img
src="${memory.image}"
>

<p>
${escapeHtml(memory.caption || "")}
</p>

</div>

<button
class="next"
onclick="nextMemory()"
>
${
memoryIndex < memories.length-1
?
t.next
:
"One More Thing ❤️"
}
</button>

`;

}


function nextMemory(){

memoryIndex++;

if(
memoryIndex >=
surprise.memories.length
){

showStep(5);

return;

}

showMemory();

}


/* CAMERA + MICROPHONE */

async function startCamera(){

showStep(2);

try{

stream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode:"user"
},

audio:true

});


$("camera").srcObject=
stream;


let AudioCtx=
window.AudioContext ||
window.webkitAudioContext;


if(!AudioCtx){

$("blowNext")
.classList.remove("hidden");

return;

}


let audio=
new AudioCtx();

let source=
audio.createMediaStreamSource(stream);

let analyser=
audio.createAnalyser();

analyser.fftSize=512;

source.connect(analyser);

let values=
new Uint8Array(
analyser.fftSize
);


function detect(){

if(!stream)
return;


analyser.getByteTimeDomainData(
values
);

let sum=0;

for(let v of values){

let x=
(v-128)/128;

sum+=x*x;

}


let volume=
Math.sqrt(
sum/values.length
);


if(volume>0.12){

$("candle").textContent=
"✨ 🎂 ✨";

$("blowNext")
.classList.remove("hidden");

return;

}


requestAnimationFrame(detect);

}


detect();


}catch(e){

$("blowNext")
.classList.remove("hidden");

}

}


function stopCamera(){

if(stream){

stream.getTracks().forEach(
track=>track.stop()
);

stream=null;

}

}


/* ESCAPE */

function escapeHtml(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* START */

loadShared();

</script>

</body>
</html>
